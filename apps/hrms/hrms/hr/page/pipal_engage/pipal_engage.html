<div class="page-loader-wrapper">
    <div class="loader">
        <div class="m-t-30"><img class="zmdi-hc-spin" src="/assets/frappe/compass/assets/images/loader.png" width="48" height="48" alt="Loader"></div>
        <p>Please wait...</p>
    </div>
</div>
<div class="row">
    <div class="col-md-4">
        <button class="btn btn-sm" style="background-color: azure;">
            <a class="text-decoration-none" href="/app/pipal-employee-dashboard"><i class="zmdi zmdi-home"></i> HR Home</a>
        </button>
    </div>
    <div class="col-md-8 text-right">
        <button class="btn btn-sm btn-primary" onclick="me.showHideData(id)" id="all">All Engage</button>
        <button class="btn btn-sm btn-primary" onclick="me.showHideData(id)" id="birthday">Birthday(s)</button>
        <button class="btn btn-sm btn-primary" onclick="me.showHideData(id)" id="anniversary">Anniversaries</button>
        <button class="btn btn-sm btn-primary" onclick="me.showHideData(id)" id="new_joiny">New Joiners</button>
    </div>
    <div class="col-12 mt-3">
        <hr class="border-2">
        
        <div class="row d-flex justify-content-center">
            
            <div class="col-md-4  birthday_section">
                <h3>Birthday <span>({{me.bithday_count}})</span></h3>
                {{me.birth_element}}
            </div>
            <div class="col-md-4 anniversary_section">
                <h3>Anniversary <span>({{me.anniversary_count}})</span></h3>
                {{me.anni_emp_ele}}
            </div>
            <div class="col-md-4 joiny_section">
                <h3>New Joiner <span>({{me.joiny_count}})</span></h3>
                {{me.recently_joiner}}
            </div>
        </div>

    </div>
</div>

<script src="/assets/frappe/compass/assets/bundles/mainscripts.bundle.js"></script>
