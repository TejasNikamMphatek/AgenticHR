<div class="page-loader-wrapper">
    <div class="loader">
        <div class="m-t-30"><img class="zmdi-hc-spin" src="/assets/frappe/compass/assets/images/loader.png" width="48" height="48" alt="Loader"></div>
        <p>Please wait...</p>
    </div>
</div>
<div class="row">
    <div class="col-md-12">
        <button class="btn btn-sm" style="background-color: azure;">
            <a class="text-decoration-none" href="/app/pipal-employee-dashboard"><i class="zmdi zmdi-home"></i> HR Home</a>
        </button>
    </div>

    <div class="col-md-12">
        <table class="table border">
            <thead>
                <tr>
                    <th>Sr.No</th>
                    <th>Emp ID</th>
                    <th>Emp Name</th>
                    <th>Emp Email</th>
                </tr>
            </thead>
            <tbody id="employees_data">
              {{me.emp_row}}
            </tbody>
        </table>
    </div>

    <div class="col-md-12 text-right my-2">
        
        <p>Note : Set Email Template in Email Template Setting for Mass Communication.</p>
        <button class="btn btn-primary  btn-sm mr-4">
            <a class="text-decoration-none text-white" href="/app/email-template-setting">Email Template Setting</a>
        </button>
        <button onclick="me.SendEmailToAll()" class="btn btn-primary btn-sm">Send Email</button>
    </div>
</div>
